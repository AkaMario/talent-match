name: talentmatch
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentmatch-local-db}
      POSTGRES_DB: talentmatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U talentmatch -d talentmatch"]
      interval: 5s
      timeout: 3s
      retries: 20
  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@talentmatch.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin-local-2026}
    ports: ["127.0.0.1:5050:80"]
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro,z
    depends_on:
      postgres: { condition: service_healthy }
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: talentmatch
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-talentmatch-local-db}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-2026}
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      [
        "./infra/keycloak/realm.json:/opt/keycloak/data/import/talentmatch.json:ro,z",
      ]
    depends_on:
      postgres: { condition: service_healthy }
  minio:
    image: ${MINIO_IMAGE:-dappros/minio:RELEASE.2025-09-07T16-13-09Z@sha256:624bad2fe79a8613aa3c5c9b765ebcab365080b8445cf1b05c357cc7753725f0}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentmatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-talentmatch-local-files}
    ports: ["127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
  ollama:
    image: alpine/ollama:0.40.6
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes: [ollama_data:/root/.ollama]
  ollama-init:
    image: alpine/ollama:0.40.6
    entrypoint: /bin/sh
    command:
      [
        "-c",
        'until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull "$${MODEL}"',
      ]
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
    depends_on: [ollama]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://talentmatch:${POSTGRES_PASSWORD:-talentmatch-local-db}@postgres:5432/talentmatch
      KEYCLOAK_ISSUER: http://localhost:8080/realms/talentmatch
      KEYCLOAK_JWKS: http://keycloak:8080/realms/talentmatch/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-talentmatch}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-talentmatch-local-files}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_started }
      minio: { condition: service_started }
      ollama: { condition: service_started }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  ollama_data:
